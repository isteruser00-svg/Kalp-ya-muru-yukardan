<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Yukarıdan Kırmızı ve Beyaz Kalp Yağmuru</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        #hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.8s ease;
            text-align: center;
        }

        .heart {
            position: absolute;
            top: -50px; /* Ekranın en üstünden (dışından) başlar */
            pointer-events: none;
            z-index: 10;
            will-change: transform, opacity;
            animation: fallAndFade linear forwards;
        }

        @keyframes fallAndFade {
            0% {
                transform: translateY(0) scale(0.7) rotate(0deg);
                opacity: 1;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                /* Ekranın en altına kadar düşüp şeffaflaşır */
                transform: translateY(105vh) scale(1.2) rotate(var(--rotation));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="hint">Ekrana Dokun ❤️🤍</div>

    <script>
        const hint = document.getElementById('hint');
        let initialTouch = true;
        
        // Kırmızı ve beyaz kalp emoji listesi
        const heartTypes = ['❤️', '🤍'];

        // Ekrana her dokunulduğunda yukarıdan yağmuru başlatır
        function triggerTopRain() {
            if (initialTouch) {
                hint.style.opacity = '0';
                initialTouch = false;
            }

            // Her tıklamada yukarıdan süzülecek kalp sayısı
            const count = 25;

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    createHeartFromTop();
                }, i * 60); // Kalplerin sırayla dökülmesi için gecikme
            }
        }

        function createHeartFromTop() {
            const heart = document.createElement('div');
            heart.className = 'heart';

            // Rastgele kırmızı veya beyaz kalp
            const randomHeart = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            heart.innerText = randomHeart;

            // Ekranın üst kısmında rastgele yatay konum (0% - 100%)
            const randomX = Math.random() * 100;

            // Düşerken hafif sağa/sola dönme açısı
            const rotation = (Math.random() - 0.5) * 80;
            // Düşüş hızı (2.5 sn ile 4 sn arası yumuşak düşüş)
            const duration = 2.5 + Math.random() * 1.5;
            // Kalp boyutu (20px ile 38px arası)
            const fontSize = 20 + Math.random() * 18;

            heart.style.left = randomX + 'vw';
            heart.style.fontSize = fontSize + 'px';
            heart.style.animationDuration = duration + 's';
            heart.style.setProperty('--rotation', rotation + 'deg');

            document.body.appendChild(heart);

            // Kalp aşağı ulaşıp kaybolduktan sonra hafızadan silinir
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Tıklama olayı (Masaüstü bilgisayar)
        window.addEventListener('click', () => {
            triggerTopRain();
        });

        // Dokunma olayı (Mobil telefonlar)
        window.addEventListener('touchstart', () => {
            triggerTopRain();
        }, { passive: true });
    </script>
</body>
</html>
